spring.application.name=humg-olympic-api
# Database
spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Flyway
spring.flyway.locations=classpath:db/migration
# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.call-setters-on-nulls=true
# JSON
spring.jackson.default-property-inclusion=non_null
# Application
application.security.jwt.secret-key=12345678910123912939123123123123123123123213
application.security.jwt.access-expiration=60
application.security.jwt.refresh-expiration=10080
application.security.cookie.secure=false
application.security.cookie.same-site=Strict